name: Build Web

# 触发方式：
#   1. 推送以 "v" 开头的 tag → 构建并把 web 站点附到同名 Release
#   2. 在 Actions 页面手动触发 → 产物以 zip 形式留在 run 的 Artifacts 里
#
# 产物：build/web 整站（含 SQLite WASM、CanvasKit），解压后可直接扔到任意静态托管
#       （GitHub Pages / Gitee Pages / Nginx / OSS）。无后端、纯静态。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  build:
    name: Build web release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Prepare SQLite for web (WASM + Worker)
        run: |
          # sqflite_common_ffi_web 需要这两个文件落在 web/ 根目录，否则浏览器里
          # 打开数据库会 404（收藏/设置/对话历史全部失效）。
          dart run sqflite_common_ffi_web:setup --force 2>/dev/null || \
            dart run sqflite_common_ffi_web:setup
          ls -l web/sqflite_sw.js web/sqlite3.wasm

      - name: Build web (release)
        run: flutter build web --release

      - name: Verify build output
        run: |
          test -f build/web/index.html
          test -f build/web/main.dart.js
          test -f build/web/sqflite_sw.js
          test -f build/web/sqlite3.wasm
          du -sh build/web
          echo "总文件数：$(find build/web -type f | wc -l)"

      - name: Stage site
        run: |
          mkdir -p artifacts
          cd build/web && zip -qr ../../artifacts/nihaisha-web.zip .
          ls -lh ../../artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nihaisha-web
          path: artifacts/nihaisha-web.zip
          retention-days: 14

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/nihaisha-web.zip
          fail_on_unmatched_files: true
