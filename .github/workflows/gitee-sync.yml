# 用 H-TWINKLE/sync-action 把 GitHub Release 里缺的 APK 补传到 Gitee 发行版。
#
# ⚠️ 实测（2026-10-30，GitHub 托管 runner）：Gitee 不拒绝上传，但把境外机房限速到
#   ~18 KB/s——sync-action 20 分钟只传到 33MB 的 74%；旧 curl 900s 连响应头都没等到。
#   4 个包共 176MB，按此速率约 2.7 小时，所以本 workflow 的超时放宽到 4 小时，
#   并允许失败后重跑（已挂上的附件会跳过）。
#
# 想几分钟就传完：在本机 Git Bash 跑 `bash tool/sync_gitee.sh`（release2gitee 单文件，
# 国内直连 Gitee）。有国内自建 runner 时，设置仓库变量 GITEE_RUNNER=<runner 标签> 即可跑本流程。
#
# 触发：发版 workflow 成功后自动跑，也可在 Actions 页手动触发。
name: Sync Release to Gitee

on:
  workflow_run:
    workflows: ["Build APK & Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitee-sync
  cancel-in-progress: false

jobs:
  sync:
    # 国内自建 runner 请把仓库变量 GITEE_RUNNER 设成它的标签；默认 GitHub 托管 runner
    # 会在上传步骤超时（见文件头说明）。
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ vars.GITEE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 260
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: sync-action（补传缺失附件）
        id: sync
        timeout-minutes: 240
        continue-on-error: true
        uses: H-TWINKLE/sync-action@0d8e95d78481848a0f3f95a737aef45437102269
        with:
          gitee_owner: jangviktor
          gitee_repo: nihaixia-app
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          github_owner: jangviktor-web
          github_repo: nihaixia-app
          gitee_upload_retry_times: '2'
          debug: 'true'

      - name: 核验 Gitee 上的 APK
        if: always()
        run: |
          set -euo pipefail
          TAG=$(gh release view --repo jangviktor-web/nihaixia-app --json tagName -q .tagName)
          CODE=$(curl -s -o /tmp/rel.json -w '%{http_code}' \
            "https://gitee.com/api/v5/repos/jangviktor/nihaixia-app/releases/tags/$TAG?access_token=$GITEE_TOKEN")
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] || exit 1
          jq -r '[.assets[]? | .name] | join(", ")' /tmp/rel.json
          N=$(jq '[.assets[]? | select(.browser_download_url | contains("/releases/download/"))] | length' /tmp/rel.json)
          echo "APK 附件数：$N"
          [ "$N" -ge 4 ] || { echo "::error::附件不足 4 个（GitHub 托管 runner 上传会被 Gitee 限流，请用国内 runner 或本机脚本）"; exit 1; }
          echo "✅ 同步完成"
